# ===== SERVER =====
server.port=${PORT:${SERVER_PORT:8080}}
spring.application.name=school-management-api

# ===== POSTGRESQL DATABASE =====
# Local: uses defaults below. Production (Render): set DB_URL, DB_USERNAME, DB_PASSWORD
# DB_URL format: jdbc:postgresql://HOST:5432/DBNAME  (NO username/password inside the URL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/Student-managment}
spring.datasource.username=${DB_USERNAME:mac}
spring.datasource.password=${DB_PASSWORD:your_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / HIBERNATE =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== JACKSON =====
spring.jackson.default-property-inclusion=non_null

# ===== SECURITY =====
# Removes the "Using generated security password" warning (JWT is used instead)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# ===== CORS - Frontend URL (no trailing slash) =====
app.cors.allowed-origin=${FRONTEND_URL:http://localhost:5173}

# ===== JWT AUTHENTICATION =====
# Secret must be at least 32 characters. Generate: openssl rand -base64 48
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===== INITIAL ADMIN ACCOUNT =====
app.seed.admin-email=${ADMIN_EMAIL:admin@school.edu}
app.seed.admin-password=${ADMIN_PASSWORD}