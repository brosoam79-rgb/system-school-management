
server.port=${SERVER_PORT:8080}

spring.application.name=school-management-api

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/Student-managment}
spring.datasource.username=${DB_USERNAME:mac}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.jackson.default-property-inclusion=non_null

# CORS
app.cors.allowed-origin=${FRONTEND_URL:http://localhost:5173}

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Admin seed configuration
app.seed.admin-email=${ADMIN_EMAIL:admin@school.edu}
app.seed.admin-password=${ADMIN_PASSWORD}
